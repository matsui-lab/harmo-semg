schema_version: 1.0.0
experiment_id: E2R
gate_id: G6b-3R
title: Multi-frame dynamic marker registration feasibility pilot
frozen_at: '2026-07-22'
freeze_state: frozen-before-registration-outcome-computation
relationship_to_g6b3: >-
  Post-outcome method development prompted by the retained negative G6b-3
  result. G6b-3 thresholds and result remain unchanged.
scientific_question: >-
  Can time-invariant, target-specific marker locations be estimated from three
  dynamic calibration trials without access to the target static-derived model
  or the 4.00 m/s benchmark trial?
claim_boundary: >-
  This is a one-subject retrospective feasibility experiment. The G6b-3
  benchmark outcome was known before this method was designed, so a repeated
  4.00 m/s assessment is exploratory and cannot be treated as independent
  confirmation. Population, clinical, muscle-force, and physiological validity
  are outside scope.
source_manifest: paper/g6b_dynamic_registration_sources.yaml
preconditions:
