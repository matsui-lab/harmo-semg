muscles:
  tibialis anterior:
    study_38_label: Tibialis Anterior
    study_120_label_candidates: [Tibialis Anterior, TibialisAnterior, TA]
    expected_peak_windows_percent: [[0, 20], [60, 100]]
    active_windows_percent: [[0, 20], [60, 100]]
    reference_window_percent: [20, 60]
  medial gastrocnemius:
    study_38_label: Gastrocnemius Medialis
    study_120_label_candidates:
      [Gastrocnemius Medialis, Medial Gastrocnemius, GastrocnemiusMedialis, GastrocnemuisMedialis, GM]
    expected_peak_windows_percent: [[20, 60]]
    active_windows_percent: [[20, 60]]
    reference_window_percent: [60, 100]

study_38_envelope:
  mean_center: true
  bandpass_hz: [20.0, 350.0]
  butterworth_order: 4
  zero_phase: true
  rectify: absolute
  hampel_window_seconds: 0.125
  hampel_sigma: 3.0
  rms_window_seconds: 0.125
  normalized_grid_points: 101
  interpolation: linear

aggregation:
  cycle_scale: divide_by_cycle_max
  subject_curve: pointwise_median
  amplitude_pooling_across_studies: false
  timing_pooling: false
  uncertainty_iterations: 10000
  uncertainty_seed: 20260723

decision_rules:
  minimum_subjects_per_study: 10
  minimum_cycles_per_subject: 5
  minimum_subject_pattern_fraction_per_muscle: 0.70
  require_positive_median_log2_phase_contrast: true
  maximum_cross_study_centroid_difference_percent: 15.0
  require_every_study_and_muscle: true
  fail_closed_on_missing_or_nonfinite: true

interpretation:
  pass: >-
    The harmonized timing representation retains a prespecified, established
    level-walking activation structure in both source studies. It does not
    validate amplitude comparability, clinical validity, force estimation, or
    OpenSim mechanics.
  fail: >-
    The endpoint remains a traceable negative result. No thresholds, subjects,
    cycles, channels, or preprocessing parameters may be changed after outcome
    inspection.

references:
  - https://doi.org/10.1038/s41597-019-0323-z
  - https://doi.org/10.1038/s41597-025-05391-0
