schema_version: 1.0.0
experiment_id: E2-G6c-S2
gate_id: G6c-S2
title: Synchronization, kinematics, and model-effect localization
frozen_at: '2026-07-22'
design:
  roles:
    model: static_derived_model
    markers: heldout_markers
    ground_reaction: heldout_ground_reaction
    raw_c3d: raw_c3d
    ik_setup: public_ik_setup
  kinematics_window_s: [19.355, 22.015]
  target_window_s: [20.355, 21.015]
  expected_target_rows: 66
  vertical_axis: 1
  gravity_m_s2: [0.0, -9.80665, 0.0]
  filter:
    type: butterworth-zero-phase-sosfiltfilt
    order: 4
    cutoff_hz: 6.0
    external_application: source-grid-before-downsampling
    selection: inherited-from-g6c-s-not-residual-fitted
  external_loads:
    platform_index_zero_based: 1
    published_prefixes: [l, r]
    c3d_to_ground_rotation:
      - [0, -1, 0]
      - [0, 0, 1]
      - [-1, 0, 0]
    c3d_time_offset_s: -0.01
    contact_threshold_n: 20.0
  synchronization:
    # Lag is selected on two windows that do not overlap the target stride.
    calibration_windows_s:
      - [19.56, 20.26]
      - [21.11, 21.81]
    minimum_lag_s: -0.05
    maximum_lag_s: 0.05
    lag_step_s: 0.001
    maximum_calibration_disagreement_s: 0.005
    minimum_target_force_relative_reduction: 0.50
    selection_metric: residual_force_fraction
    target_used_for_lag_selection: false
  mass_diagnostic:
    maximum_plausible_relative_mass_change: 0.02
    auto_apply: false
  factorial:
    cells:
      - original_model_ik
      - original_model_rra_kinematics
      - adjusted_model_ik
      - adjusted_model_rra_kinematics
    minimum_contributor_relative_reduction: 0.25
    rra_window: padded-kinematics-window
    source_g6c_rra_configuration: exact-inheritance
opensim:
  required_version: 4.5.2
thresholds:
  residual_force_fraction: 0.05
  residual_moment_fraction: 0.01
missing_policy: fail-closed-and-retain-result
claim_boundary: >-
  cause localization only; post-RRA closure does not validate the public ID,
  dynamic-only personalization, joint moments, or muscle forces
