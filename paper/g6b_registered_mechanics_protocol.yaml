title: Exploratory held-out mechanics after dynamic marker registration
frozen_at: '2026-07-22'
freeze_state: frozen-after-registration-and-before-registered-heldout-computation
relationship_to_g6b3: >-
  Uses the unchanged G6b-3 mechanics protocol and thresholds. The original
  G6b-3 result remains the retained baseline.
scientific_question: >-
  Does calibration-only, target-specific marker registration improve the
  already observed 4.00 m/s benchmark mechanics relative to the retained
  unregistered G6b-3 result?
claim_boundary: >-
  This is exploratory method-development evidence because the 4.00 m/s
  benchmark result was observed before marker registration was designed. It
  tests technical feasibility but is not independent confirmation and does not
  establish population, rehabilitation, clinical, muscle-force, or
  physiological validity.
