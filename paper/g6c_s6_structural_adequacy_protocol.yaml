claim_boundary: >-
  G6c-S6 tests whether the retained source-faithful RRA corrective moment has a
  repeatable gait-locked component and whether independently observed upper-limb
  motion can carry angular momentum of the same order. Integrating residual
  torque yields required corrective angular momentum, not an observation of an
  omitted body segment. The Study 1 comparison is a different subject and
  activity and uses an orbital midpoint proxy without segment spin; it is
  descriptive plausibility evidence only. Missing force-platform geometry or a
  subject-matched full-body versus arm-lumped model pair blocks causal structural
  attribution. G6c-S6 cannot validate personalization, joint moments, muscle
  forces, or clinical use.
