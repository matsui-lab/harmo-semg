# harmo C3D study template
# Generated by: harmo init --type c3d
#
# Edit this file to match your study structure, then run:
#   harmo validate --config config.yaml
#   harmo ingest --config config.yaml --dry-run

# --- Rules ---
# Do NOT use underscores in study_id, subject_id, session_id
# Use hyphens instead

# --- Basic settings ---
input_dir_aliases:
  my_study: '/workspace/data'
warehouse_path: '/workspace/warehouse'

# --- Definitions (dimension tables) ---
definitions:
  studies:
    source_type: 'yaml'
    path: 'definitions/study_description.yaml'
    yaml_key: 'studies'
    table_name: 'local.warehouse.study_table'

  subjects:
    source_type: 'csv'
    path: 'definitions/subject_info.csv'
    reader_options: {sep: ','}
    table_name: 'local.warehouse.subject_table'

  sessions:
    source_type: 'csv'
    path: 'definitions/session_info.csv'
    reader_options: {sep: ','}
    table_name: 'local.warehouse.session_info'

  markers:
    source_type: 'yaml'
    path: 'definitions/marker.yaml'
    yaml_key: 'marker_config'
    table_name: 'local.warehouse.dim_marker'
    normalize_func: 'normalize_markers'

  channels:
    source_type: 'yaml'
    path: 'definitions/channels.yaml'
    yaml_key: 'channels'
    table_name: 'local.warehouse.dim_channels'

  devices:
    source_type: 'yaml'
    path: 'definitions/devices.yaml'
    yaml_key: 'devices'
    table_name: 'local.warehouse.device_table'

  coordinates:
    source_type: 'yaml'
    path: 'definitions/coordinates.yaml'
    yaml_key: 'coordinates'
    table_name: 'local.warehouse.dim_coordinate'

# --- File mappings (fact tables) ---
file_mappings:
  - name: "My C3D Motion Capture"
    base_input_dir_alias: 'my_study'
    iceberg_table: 'local.warehouse.raw_data'
    input_path_template: 'Subject{sub_id}/Session{ses_id}/trial{trial_id}.c3d'
    path_patterns:
      sub_id: '(\d+)'
      ses_id: '(\d+)'
      trial_id: '(\d+)'
    file_format: 'c3d'
    session_id_template: "ses-{ses_id}-T{trial_id}"
    static_metadata:
      sensor_type: 'Motion-capture'

  - name: "My C3D force"
    c3d_data_source: 'analog'      
    calc_cop: true
    channel_definitions_path: 'definitions/channels.yaml'
    session_id_template: "{ses_id}"
    static_metadata:
      sensor_type: 'Force-plate'
